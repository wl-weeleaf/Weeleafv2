<!doctype html><html lang="da"><head><meta charset="utf-8"><title>Leafys browser</title><link rel="stylesheet" href="popup.css"></head><body><h1>Leafys browser <small>0.3</small></h1><p>Giv Leafy en kommando i samtalen. Leafy åbner selv en relevant side i browservinduet i Leafy-appen.</p><div id="setup"><label>Parringskode fra Leafy<input id="code" autocomplete="off" spellcheck="false"></label><button id="connect">Forbind Leafys browser</button><p>Du godkender én samlet adgang til alle HTTPS-sider. Du skal ikke vælge en fane eller tillade hvert website.</p></div><div id="connected" hidden><p id="status"></p><button id="show">Vis Leafys fane</button><button id="pause">Overtag kontrollen</button><button id="resume">Fortsæt Leafy</button><button id="disconnect">Afbryd forbindelsen</button></div><p>Adgangskoder, MitID og betaling giver kontrollen tilbage til dig.</p><p id="notice" role="status"></p><script src="popup.js"></script></body></html>
